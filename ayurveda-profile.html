<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocayur - Your Ayurveda Profile</title>
  <meta name="description"
    content="Ocayur Patient Portal - Your Ayurveda Assessment & Dosha Prakruti Profile Result">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Page Loader Overlay -->
  <div class="page-loader-overlay" id="pageLoader" role="status" aria-live="polite">
    <div class="page-loader-card">
      <div class="page-loader-spinner"></div>
      <p class="page-loader-text">Loading profile...</p>
    </div>
  </div>

  <main class="login-page-container">
    <!-- Brand Logo Section -->
    <header class="brand-header">
      <a href="index.html" class="brand-logo-link" title="Ocayur Ayurveda Lifestyle">
        <img src="assets/logo.svg" alt="Ocayur Ayurveda Lifestyle"
          class="brand-logo-img" width="160" height="88" />
      </a>
    </header>

    <!-- Your Ayurveda Profile Result Card -->
    <section class="auth-card profile-card" id="profileCard" aria-labelledby="profile-heading">
      <div class="card-header profile-header">
        <h1 id="profile-heading" class="card-title profile-title">Your Ayurveda Profile</h1>
      </div>

      <div class="profile-content">
        <!-- Flame Icon for Agni / Dosha -->
        <div class="profile-icon-wrapper" aria-hidden="true">
          <svg class="profile-flame-icon" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M12 2.5C12 2.5 7 8 7 14C7 16.7614 9.23858 19 12 19C14.7614 19 17 16.7614 17 14C17 8 12 2.5 12 2.5Z" />
            <path
              d="M12 19C10.6193 19 9.5 17.8807 9.5 16.5C9.5 14 12 11.5 12 11.5C12 11.5 14.5 14 14.5 16.5C14.5 17.8807 13.3807 19 12 19Z" />
          </svg>
        </div>

        <!-- Profile Type Name -->
        <h2 class="profile-type-title" id="profileTypeName">Agni</h2>

        <!-- Profile Description -->
        <p class="profile-description" id="profileDescription">
          Your assessment indicates Agni. Your responses suggest that digestion, sleep and stress management may be
          important areas to focus on.
        </p>

        <!-- Action Button (Navigates to Dashboard) -->
        <a href="dashboard/dashboard.html" class="btn-primary btn-explore" id="explorePackagesBtn">
          <span>Explore Packages</span>
        </a>
      </div>
    </section>
  </main>

  <!-- Interactive Feedback Toast -->
  <div id="toast" class="toast-msg" role="status" aria-live="polite">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <span id="toastMsg">Welcome to Ocayur!</span>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Page Loader Overlay Logic
      const pageLoader = document.getElementById('pageLoader');
      const hidePageLoader = () => {
        if (!pageLoader) return;
        pageLoader.classList.add('hidden');
        setTimeout(() => {
          pageLoader.style.display = 'none';
        }, 450);
      };
      setTimeout(hidePageLoader, 350);

      const explorePackagesBtn = document.getElementById('explorePackagesBtn');
      const profileTypeName = document.getElementById('profileTypeName');
      const profileDescription = document.getElementById('profileDescription');
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');

      // Helper: Toast Message
      const showToast = (message, isError = false) => {
        if (!toast || !toastMsg) return;
        toastMsg.textContent = message;
        toast.style.background = isError ? '#ef4444' : '#1e293b';
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 3200);
      };

      // Load dynamic assessment result if stored
      try {
        const storedUser = JSON.parse((localStorage.getItem('ocayur_user') || localStorage.getItem('panchved_user')) || 'null');
        const storedPatient = JSON.parse((localStorage.getItem('ocayur_patient') || localStorage.getItem('panchved_patient')) || 'null');
        const assessment = JSON.parse((localStorage.getItem('ocayur_prakruti_result') || localStorage.getItem('panchved_prakruti_result')) || 'null');

        if (assessment && profileTypeName && profileDescription) {
          if (assessment.title || assessment.type) {
            profileTypeName.textContent = assessment.title || assessment.type;
          }
          if (assessment.description) {
            profileDescription.textContent = assessment.description;
          }
        }
      } catch (e) {}

      // Handle explore packages navigation
      if (explorePackagesBtn) {
        explorePackagesBtn.addEventListener('click', (e) => {
          e.preventDefault();
          showToast('Opening Patient Dashboard...');
          setTimeout(() => {
            window.location.href = 'dashboard/dashboard.html';
          }, 350);
        });
      }
    });
  </script>
</body>

</html>
