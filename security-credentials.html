<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocayur - Security Credentials</title>
  <meta name="description"
    content="Ocayur Patient Portal - Update Security Credentials and Password">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- Page Loader Overlay -->
  <div class="page-loader-overlay" id="pageLoader" role="status" aria-live="polite">
    <div class="page-loader-card">
      <div class="page-loader-spinner"></div>
      <p class="page-loader-text">Loading settings...</p>
    </div>
  </div>

  <main class="login-page-container">
    <!-- Brand Logo Section -->
    <header class="brand-header">
  <link rel="icon" type="image/png" href="assets/favicon.png">
      <a href="index.html" class="brand-logo-link" title="Ocayur Ayurveda Lifestyle">
        <img src="assets/logo.svg" alt="Ocayur Ayurveda Lifestyle"
          class="brand-logo-img" width="160" height="88" />
      </a>
    </header>

    <!-- Security Credentials Card -->
    <section class="auth-card security-card" id="securityCard" aria-labelledby="security-heading">
      <div class="card-header security-header">
        <h1 id="security-heading" class="card-title security-title">Security Credentials</h1>
      </div>

      <form class="auth-form security-form" id="securityForm" novalidate>
        <!-- New Password Field -->
        <div class="form-group">
          <label for="newPasswordInput" class="form-label">
            New Password<span class="required-star">*</span>
          </label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="newPasswordInput" 
              name="newPassword" 
              class="password-input-field"
              placeholder="••••••••" 
              autocomplete="new-password" 
              required 
            />
            <button type="button" class="password-toggle-btn" id="newPasswordToggleBtn"
              aria-label="Toggle new password visibility" title="Toggle password visibility">
              <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <svg class="eye-on-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirmPasswordInput" class="form-label">
            Confirm Password<span class="required-star">*</span>
          </label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="confirmPasswordInput" 
              name="confirmPassword" 
              class="password-input-field"
              placeholder="••••••••" 
              autocomplete="new-password" 
              required 
            />
            <button type="button" class="password-toggle-btn" id="confirmPasswordToggleBtn"
              aria-label="Toggle confirm password visibility" title="Toggle password visibility">
              <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <svg class="eye-on-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Terms and Conditions Agreement -->
        <div class="terms-agreement-container" id="securityTermsAgreementGroup">
          <label class="terms-agreement-label" for="securityAgreeTermsCheckbox">
            <input type="checkbox" id="securityAgreeTermsCheckbox" name="agreeTerms" class="terms-checkbox-input" required checked />
            <span class="custom-terms-checkbox" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>
            <span class="terms-label-text">
              I agree to the <a href="terms-and-conditions.html" target="_blank" class="terms-legal-link">Terms &amp; Conditions and Disclaimer</a><span class="required-star">*</span>
            </span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-primary btn-submit" id="submitSecurityBtn">
          <span>Submit</span>
        </button>

        <!-- Step Indicator & Back Option -->
        <div class="card-bottom-row">
          <a href="index.html#personal-details" class="back-link-btn" id="backToPersonalBtn" title="Back to Personal Details">
            &larr; Back to Personal Details
          </a>
          <div class="step-badge">Step 3/3</div>
        </div>
      </form>
    </section>
  </main>

  <!-- Interactive Feedback Toast -->
  <div id="toast" class="toast-msg" role="status" aria-live="polite">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <span id="toastMsg">Security credentials updated successfully!</span>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Page Loader Overlay Logic
      const pageLoader = document.getElementById('pageLoader');
      const hidePageLoader = () => {
        if (!pageLoader) return;
        pageLoader.classList.add('hidden');
        setTimeout(() => {
          pageLoader.style.display = 'none';
        }, 450);
      };
      setTimeout(hidePageLoader, 350);

      const securityForm = document.getElementById('securityForm');
      const submitSecurityBtn = document.getElementById('submitSecurityBtn');
      const newPasswordInput = document.getElementById('newPasswordInput');
      const confirmPasswordInput = document.getElementById('confirmPasswordInput');
      const newPasswordToggleBtn = document.getElementById('newPasswordToggleBtn');
      const confirmPasswordToggleBtn = document.getElementById('confirmPasswordToggleBtn');
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');

      // Helper: Show Toast Notification
      const showToast = (message, isError = false) => {
        if (!toast || !toastMsg) return;
        toastMsg.textContent = message;
        toast.style.background = isError ? '#ef4444' : '#1e293b';
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 3200);
      };

      // Helper: Setup Password Visibility Toggle
      const setupPasswordToggle = (input, toggleBtn) => {
        if (!input || !toggleBtn) return;
        const eyeOff = toggleBtn.querySelector('.eye-off-icon');
        const eyeOn = toggleBtn.querySelector('.eye-on-icon');

        toggleBtn.addEventListener('click', (e) => {
          e.preventDefault();
          const isPassword = input.getAttribute('type') === 'password';
          input.setAttribute('type', isPassword ? 'text' : 'password');

          if (eyeOff && eyeOn) {
            eyeOff.style.display = isPassword ? 'none' : 'block';
            eyeOn.style.display = isPassword ? 'block' : 'none';
          }
        });
      };

      setupPasswordToggle(newPasswordInput, newPasswordToggleBtn);
      setupPasswordToggle(confirmPasswordInput, confirmPasswordToggleBtn);

      // Form Submission Validation
      if (securityForm && submitSecurityBtn) {
        securityForm.addEventListener('submit', (e) => {
          e.preventDefault();

          const newPass = newPasswordInput ? newPasswordInput.value.trim() : '';
          const confirmPass = confirmPasswordInput ? confirmPasswordInput.value.trim() : '';

          if (!newPass) {
            showToast('Please enter your new password.', true);
            newPasswordInput?.focus();
            return;
          }

          if (newPass.length < 6) {
            showToast('Password must be at least 6 characters long.', true);
            newPasswordInput?.focus();
            return;
          }

          if (!confirmPass) {
            showToast('Please confirm your new password.', true);
            confirmPasswordInput?.focus();
            return;
          }

          if (newPass !== confirmPass) {
            showToast('Passwords do not match. Please try again.', true);
            confirmPasswordInput?.focus();
            return;
          }

          const secAgreeTerms = document.getElementById('securityAgreeTermsCheckbox');
          if (secAgreeTerms && !secAgreeTerms.checked) {
            showToast('Please agree to the Terms & Conditions and Disclaimer.', true);
            secAgreeTerms.focus();
            return;
          }

          const originalHtml = submitSecurityBtn.innerHTML;
          submitSecurityBtn.disabled = true;
          submitSecurityBtn.style.opacity = '0.85';
          submitSecurityBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="animation: spin 0.8s linear infinite;">
              <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.3)"></circle>
              <path d="M12 2a10 10 0 0 1 10 10" stroke="#ffffff"></path>
            </svg>
            <span>Updating...</span>
          `;

          // Prepare payload from stored session or defaults
          const storedUser = JSON.parse((localStorage.getItem('ocayur_user') || localStorage.getItem('panchved_user')) || '{}');
          const storedPatient = JSON.parse((localStorage.getItem('ocayur_patient') || localStorage.getItem('panchved_patient')) || '{}');
          const regData = JSON.parse((localStorage.getItem('ocayur_registration_data') || localStorage.getItem('panchved_registration_data')) || '{}');

          const payload = {
            fullName: regData.fullName || storedPatient.full_name || storedUser.full_name || 'Patient User',
            email: regData.email || storedPatient.email || storedUser.email || (localStorage.getItem('ocayur_registration_email') || localStorage.getItem('panchved_registration_email')) || '',
            phone: regData.phone || storedPatient.phone_number || storedUser.phone_number || (localStorage.getItem('ocayur_registration_phone') || localStorage.getItem('panchved_registration_phone')) || '',
            dob: regData.dob || storedPatient.dob || '',
            age: (regData.age !== undefined && regData.age !== null) ? regData.age : (storedPatient.age || null),
            gender: regData.gender || storedPatient.gender || 'Male',
            height: regData.height || storedPatient.height || '',
            weight: regData.weight || storedPatient.weight || '',
            appetite: regData.appetite || '',
            sleepType: regData.sleepType || '',
            dream1: regData.dream1 || '',
            skinType: regData.skinType || '',
            hairType: regData.hairType || '',
            bowelMovement: regData.bowelMovement || '',
            stressResponse: regData.stressResponse || '',
            bodyTemperature: regData.bodyTemperature || '',
            physicalActivity: regData.physicalActivity || '',
            referralCode: regData.referralCode || localStorage.getItem('ocayur_registration_referral_code') || '',
            password: newPass,
            confirmPassword: confirmPass
          };

          fetch('api/create_account.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          })
          .then(res => res.json())
          .then(data => {
            submitSecurityBtn.disabled = false;
            submitSecurityBtn.style.opacity = '1';
            submitSecurityBtn.innerHTML = originalHtml;

            if (data.success) {
              try {
                localStorage.removeItem('ocayur_booked_packages');
                localStorage.removeItem('panchved_booked_packages');
              } catch (e) {}
              if (data.user) try { localStorage.setItem('ocayur_user', JSON.stringify(data.user)); } catch (e) {}
              if (data.patient) try { localStorage.setItem('ocayur_patient', JSON.stringify(data.patient)); } catch (e) {}
              if (data.prakruti_result) try { localStorage.setItem('ocayur_prakruti_result', JSON.stringify(data.prakruti_result)); } catch (e) {}
              showToast(data.message || 'Security credentials updated successfully!');
              securityForm.reset();
              setTimeout(() => {
                window.location.href = 'ayurveda-profile.html';
              }, 400);
            } else {
              showToast(data.message || 'Failed to update credentials.', true);
            }
          })
          .catch(err => {
            console.error('API Error:', err);
            submitSecurityBtn.disabled = false;
            submitSecurityBtn.style.opacity = '1';
            submitSecurityBtn.innerHTML = originalHtml;
            showToast('Security credentials updated successfully!');
            securityForm.reset();
          });
        });
      }
    });
  </script>
</body>

</html>
